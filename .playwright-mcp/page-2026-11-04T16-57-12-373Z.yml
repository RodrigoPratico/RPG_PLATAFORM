            - heading "O que sabemos" [level=3] [ref=e264]
            - paragraph [ref=e265]: "Morreu em outro mundo e tomou o poder de Aethran durante a bênção. Carrega duas almas divinas: Aethran, de memórias nítidas, e a entidade de Durnholm, de memórias turvas. Objetivo declarado: absorver todos os deuses. Curou Brennford, 1.200 pessoas em Thornwick e ressuscitou 8.840 em Durnholm. Obteve o reino por carta legal, sem matar súditos. Agora: pátio norte do castelo, às 02h. Exausta após sete dias de extrações; leva a mão ao peito sem perceber. Politicamente protegida pela Carta e pela barreira. Nunca matou um ser humano. Sua linguagem de posse é questionada pelos aliados."
